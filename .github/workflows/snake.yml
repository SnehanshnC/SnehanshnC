name: snake

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Palettes match assets/header-*.svg: amber #f2a33c on brown #211d16.
      - name: generate snake from the contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#211d16&color_dots=#ece7dc,#f7dfae,#f2c579,#e0a03f,#a8701c
            dist/github-snake-dark.svg?color_snake=#e8ecf4&color_dots=#191510,#4d3512,#8a5f18,#c98b2a,#f2a33c

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
